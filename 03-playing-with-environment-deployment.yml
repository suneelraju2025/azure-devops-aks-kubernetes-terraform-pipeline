# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- master

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - bash: echo " Do the build"

- stage: DevDeploy
  jobs:
  - deployment: DevDeployJob
    environment: Dev
    strategy:
       runOnce:
          deploy:
             steps:
               -  script: echo deploy to dev environment
               -  bash: echo " QA approval is needed to deploy to QA"

- stage: QADeploy
  jobs:
  - deployment: DeploytoQAJob
    environment: QA
    strategy:
     runOnce:
        deploy:
           steps:
             - script: echo deploy to QA environment
